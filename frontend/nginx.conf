server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Serve index.html for client-side routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-term caching for Vite's hashed build assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
