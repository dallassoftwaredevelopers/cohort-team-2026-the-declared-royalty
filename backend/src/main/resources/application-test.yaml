spring:
  datasource:
    # Boots up an isolated, in-memory PostgreSQL compatibility layout
    url: jdbc:h2:mem:invoice_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      # Automatically creates schema objects dynamically out of Entities for unit tests
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true

  # Prevents flyway from crashing trying to run raw production-only migrations
  flyway:
    enabled: false
