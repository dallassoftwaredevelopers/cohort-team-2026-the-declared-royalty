get:
  summary: Get vendor by UUID
  operationId: getVendorByUuid
  tags:
    - Vendors
  parameters:
    - $ref: '../components/parameters/VendorUuid.yaml'
  responses:
    '200':
      description: Vendor found
      content:
        application/json:
          schema:
            $ref: '../components/schemas/VendorResponse.yaml'
    '404':
      description: Vendor not found
      content:
        application/json:
          schema:
            $ref: '../components/schemas/ErrorResponse.yaml'

put:
  summary: Update a vendor
  description: >
    Partial update of the vendor's editable fields. Only fields present in the request
    are changed; omitted or null fields keep their current value.
    vendorUuid and createdAt are never changed; updatedAt is set to the current time.
  operationId: updateVendor
  tags:
    - Vendors
  parameters:
    - $ref: '../components/parameters/VendorUuid.yaml'
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../components/schemas/VendorUpdateRequest.yaml'
  responses:
    '200':
      description: Vendor updated successfully
      content:
        application/json:
          schema:
            $ref: '../components/schemas/VendorResponse.yaml'
    '400':
      description: Invalid request body
      content:
        application/json:
          schema:
            $ref: '../components/schemas/ErrorResponse.yaml'
    '404':
      description: Vendor not found
      content:
        application/json:
          schema:
            $ref: '../components/schemas/ErrorResponse.yaml'
