get:
  summary: Get the original uploaded file for an invoice
  operationId: getInvoiceFile
  tags:
    - Invoice Uploads
  parameters:
    - name: invoiceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    '200':
      description: The original file, served inline for viewing
      content:
        application/pdf:
          schema:
            type: string
            format: binary
        image/png:
          schema:
            type: string
            format: binary
        image/jpeg:
          schema:
            type: string
            format: binary
    '404':
      description: Invoice not found, or it has no file (e.g. manually entered)
      content:
        application/json:
          schema:
            $ref: '../components/schemas/ErrorResponse.yaml'
    '503':
      description: File storage unavailable
      content:
        application/json:
          schema:
            $ref: '../components/schemas/ErrorResponse.yaml'