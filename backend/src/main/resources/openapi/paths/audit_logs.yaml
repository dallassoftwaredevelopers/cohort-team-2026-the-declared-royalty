post:
  summary: Create a new Audit Log
  operationId: createAuditLog
  tags:
    - Audit Logs
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../components/schemas/AuditLogCreateRequest.yaml'
  responses:
    '201':
      description: Audit Log successfully created
      content:
        application/json:
          schema:
            $ref: '../components/schemas/AuditLogResponse.yaml'
get:
  summary: List all audit logs
  operationId: getAuditLogs
  tags:
   - Audit Logs
  parameters:
    - name: invoice
      in: query
      required: false
      schema:
        type: string
        format: uuid
      description: "Filter logs by a specific Invoice ID."
      example: "7b8a9c0d-1e2f-3a4b-5c6d-7e8f9a0b1c2d"
    - name: actionType
      in: query
      required: false
      schema:
        type: string
      description: "Filter by specific action types (e.g., SYSTEM_PAID, USER_IDENTIFIED)."
      example: "SYSTEM_IDENTIFIED"
    - name: fromState
      in: query
      required: false
      schema:
        type: string
      description: "Filter logs by the starting financial value or prior state signature."
      example: "4000.00"
    - name: toState
      in: query
      required: false
      schema:
        type: string
      description: "Filter logs by the ending financial value or target state signature."
      example: "4500.00"

  responses:
    '200':
      description: A list of audit logs
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '../components/schemas/AuditLogResponse.yaml'
