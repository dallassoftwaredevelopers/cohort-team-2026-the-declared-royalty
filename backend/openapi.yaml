openapi: 3.0.3
info:
  title: Invoice Automation API
  description: Core API contract for managing properties, vendors, and invoice lifecycles.
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: Local Development Server

paths:
  /api/v1/properties:
    get:
      summary: List all properties
      operationId: getProperties
      tags:
        - Properties
      responses:
        '200':
          description: A list of managed properties
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PropertyResponse'

    post:
      summary: Create a new property
      operationId: createProperty
      tags:
        - Properties
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PropertyCreateRequest'
      responses:
        '201':
          description: Property created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PropertyResponse'

  /api/v1/properties/{propertyId}:
    get:
      summary: Get property by ID
      operationId: getPropertyById
      tags:
        - Properties
      parameters:
        - name: propertyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Property found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PropertyResponse'
        '404':
          description: Property not found
  /api/v1/users:
    post:
      summary: Create a new user
      operationId: createUser
      tags:
        - Users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateRequest'
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
    get:
      summary: List all users
      operationId: getUsers
      tags:
        - Users
      responses:
        '200':
          description: A list of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserResponse'
  /api/v1/users/{userId}:
    get:
      summary: Get user by UserId
      operationId: getUserByUserId
      tags:
        - Users
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: User found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '404':
          description: User not found
    put:
      summary: Update user by UserId
      operationId: updateUserByUserId
      tags:
        - Users
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
      responses:
        '200':
          description: User updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '404':
          description: User not found
    delete:
      summary: Deactivate a user by UserId
      operationId: deactivateUserByUserId
      tags:
        - Users
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: User deactivated successfully
        '404':
          description: User not found

  /api/v1/vendors:
    get:
      summary: List all vendors
      operationId: getVendors
      tags:
        - Vendors
      responses:
        '200':
          description: A list of vendors (empty array when none exist)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VendorResponse'

    post:
      summary: Create a new vendor
      operationId: createVendor
      tags:
        - Vendors
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VendorCreateRequest'
      responses:
        '201':
          description: Vendor created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VendorResponse'
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/vendors/{vendorUuid}:
    get:
      summary: Get vendor by UUID
      operationId: getVendorByUuid
      tags:
        - Vendors
      parameters:
        - $ref: '#/components/parameters/VendorUuid'
      responses:
        '200':
          description: Vendor found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VendorResponse'
        '404':
          description: Vendor not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      summary: Update a vendor
      description: >
        Partial update of the vendor's editable fields. Only fields present in the request
        are changed; omitted or null fields keep their current value.
        vendorUuid and createdAt are never changed; updatedAt is set to the current time.
      operationId: updateVendor
      tags:
        - Vendors
      parameters:
        - $ref: '#/components/parameters/VendorUuid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VendorUpdateRequest'
      responses:
        '200':
          description: Vendor updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VendorResponse'
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Vendor not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/audit-logs:
    post:
      summary: Create a new Audit Log
      operationId: createAuditLog
      tags:
        - Audit Logs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuditLogCreateRequest'
      responses:
        '201':
          description: Audit Log successfully created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogResponse'
    get:
      summary: List all audit logs
      operationId: getAuditLogs
      tags:
        - Audit Logs
      parameters:
        - name: invoice
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: "Filter logs by a specific Invoice ID."
          example: "7b8a9c0d-1e2f-3a4b-5c6d-7e8f9a0b1c2d"
        - name: actionType
          in: query
          required: false
          schema:
            type: string
          description: "Filter by specific action types (e.g., SYSTEM_PAID, USER_IDENTIFIED)."
          example: "SYSTEM_IDENTIFIED"
        - name: fromState
          in: query
          required: false
          schema:
            type: string
          description: "Filter logs by the starting financial value or prior state signature."
          example: "4000.00"
        - name: toState
          in: query
          required: false
          schema:
            type: string
          description: "Filter logs by the ending financial value or target state signature."
          example: "4500.00"

      responses:
        '200':
          description: A list of audit logs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuditLogResponse'

  /api/v1/audit-logs/{auditUuid}:
    get:
      summary: Get audit log by ID
      operationId: getAuditLogById
      tags:
        - Audit Logs
      parameters:
        - name: auditUuid
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Audit Log found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogResponse'
        '404':
          description: Audit Log not found

components:
  parameters:
    VendorUuid:
      name: vendorUuid
      in: path
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    PropertyCreateRequest:
      type: object
      required:
        - name
        - streetAddress
        - city
        - state
        - zipCode
      properties:
        name:
          type: string
          example: "Industrial Business Park"
        streetAddress:
          type: string
          example: "125 Industrial Way"
        city:
          type: string
          example: "Springfield"
        state:
          type: string
          example: "IL"
        zipCode:
          type: string
          example: "62701"

    PropertyResponse:
      type: object
      required:
        - propertyId
        - name
        - streetAddress
        - city
        - state
        - zipCode
        - status
      properties:
        propertyId:
          type: string
          format: uuid
        name:
          type: string
        streetAddress:
          type: string
        city:
          type: string
        state:
          type: string
        zipCode:
          type: string
        status:
          type: string
          example: "ACTIVE"

    VendorStatus:
      type: string
      enum:
        - ACTIVE
        - INACTIVE

    PaymentMethod:
      type: string
      enum:
        - ACH
        - CHECK
        - CREDIT_CARD

    VendorCreateRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          maxLength: 255
          example: "Acme Plumbing Co."
        phoneNumber:
          type: string
          maxLength: 255
          example: "555-123-4567"
        status:
          description: Defaults to ACTIVE when omitted.
          allOf:
            - $ref: '#/components/schemas/VendorStatus'
        paymentUrl:
          type: string
          maxLength: 225
          example: "https://pay.acmeplumbing.com"
        paymentMethod:
          description: Defaults to ACH when omitted.
          allOf:
            - $ref: '#/components/schemas/PaymentMethod'

    VendorUpdateRequest:
      type: object
      description: >
        Partial update of a vendor. All fields are optional; omitted or null fields are left unchanged.
      properties:
        name:
          type: string
          maxLength: 255
          example: "Acme Plumbing Co."
        phoneNumber:
          type: string
          maxLength: 255
          example: "555-123-4567"
        status:
          $ref: '#/components/schemas/VendorStatus'
        paymentUrl:
          type: string
          maxLength: 225
          example: "https://pay.acmeplumbing.com"
        paymentMethod:
          $ref: '#/components/schemas/PaymentMethod'

    VendorResponse:
      type: object
      required:
        - vendorUuid
        - name
        - status
        - paymentMethod
        - createdAt
        - updatedAt
      properties:
        vendorUuid:
          type: string
          format: uuid
        name:
          type: string
        phoneNumber:
          type: string
        status:
          $ref: '#/components/schemas/VendorStatus'
        paymentUrl:
          type: string
        paymentMethod:
          $ref: '#/components/schemas/PaymentMethod'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    UserCreateRequest:
      type: object
      required:
        - username
        - email
      #        - password
      properties:
        username:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          default: "ADMIN"
        status:
          type: string
          default: "ACTIVE"
    UserUpdateRequest:
      type: object
      properties:
        username:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
        status:
          type: string

    UserResponse:
      type: object
      required:
        - userId
        - createdAt
        - updatedAt
      properties:
        userId:
          type: string
          format: uuid
        username:
          type: string
        email:
          type: string
        role:
          type: string
        status:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ErrorResponse:
      type: object
      required:
        - status
        - error
        - message
        - timestamp
      properties:
        status:
          type: integer
          example: 404
        error:
          type: string
          example: "Not Found"
        message:
          type: string
          example: "Vendor not found: 3f2b7c1e-8a4d-4c55-9b0e-2d6f1a7e9c10"
        path:
          type: string
          example: "/api/v1/vendors/3f2b7c1e-8a4d-4c55-9b0e-2d6f1a7e9c10"
        timestamp:
          type: string
          format: date-time


    AuditLogCreateRequest:
      type: object
      required:
        - invoice
        - user
        - actionType
        - actionTaken
        - fromState
        - toState
      properties:
        invoice:
          type: string
          format: uuid
        user:
          type: string
          format: uuid
          description: "The UUID of the authorizing user whose credentials and permissions were used."
          example: "7b8a9c0d-1e2f-3a4b-5c6d-7e8f9a0b1c2d"
        actionType:
          type: string
          description: "Indicates the operation category, explicitly prefixing automated actions executed on behalf of a user"
          enum:
            # 1. INGESTED
            - SYSTEM_INGESTED
            - USER_INGESTED
            # 2. IDENTIFIED
            - SYSTEM_IDENTIFIED
            - USER_IDENTIFIED
            # 3. MATCHED
            - SYSTEM_MATCHED
            - USER_MATCHED
            # 4. VALIDATED
            - SYSTEM_VALIDATED
            - USER_VALIDATED
            # 5. APPROVED
            - SYSTEM_APPROVED
            - USER_APPROVED
            # 6. PAID
            - SYSTEM_PAID
            - USER_PAID
          example: "SYSTEM_MATCHED"
        actionTaken:
          type: string
          example: "AI parsed invoice layout under user 7453 permissions."
        fromState:
          type: string
          description: "The monetary value or prior transaction status before this operation."
          example: "UNASSIGNED"
        toState:
          type: string
          description: "The monetary value or prior transaction status after this operation."
          example: "PROPERTY_ID_8820"
        notes:
          type: string
          description: "Optional details about verification metrics, system flags, or user reasoning."
          example: "User corrected the invoice total from original extraction of $4,000.00."


    AuditLogResponse:
      type: object
      required:
        - auditLogId
        - invoice
        - user
        - actionType
        - actionTaken
        - fromState
        - toState
        - notes
        - createdAt
        - updatedAt
      properties:
        auditLogId:
          type: string
          format: uuid
        invoice:
          type: string
          format: uuid
        user:
          type: string
          format: uuid
        actionType:
          type: string
          example: "SYSTEM_APPROVED"
        actionTaken:
          type: string
          example: "System approved payment of bill"
        fromState:
          type: string
          example: "DRAFT_AMOUNT: $4500.00"
        toState:
          type: string
          example: "APPROVED_AMOUNT: $4500.00"
        notes:
          type: string
          example: "Confidence score: 93%. System approved $4500.00 on 10/31/27."
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
